<title>Мостик Ковчега-7</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: полноэкранный 3D-вид от первого лица; приборная панель HUD сверху, посты и действия снизу */
:root{
  --abyss:#021219;
  --hull:rgba(10,30,40,.82);
  --rib:#24505e;
  --ink:#d8e8ea;
  --ink-dim:#8fb0b6;
  --glow:#5ef2d6;
  --sodium:#ffb259;
  --alarm:#ff5d6c;
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Golos Text","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--abyss);color:var(--ink);font-family:var(--f-body)}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#stage canvas:active{cursor:grabbing}
.pane{background:var(--hull);border:1px solid var(--rib);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.top{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;pointer-events:none;
  padding-top:calc(env(safe-area-inset-top,0px) + 12px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.id{padding:8px 12px;display:grid;gap:2px}
.id b{font-family:var(--f-display);font-weight:800;font-size:15px;letter-spacing:.02em}
.id span{font-family:var(--f-mono);font-size:11px;color:var(--ink-dim)}
.gauges{display:flex;gap:0;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.gauges div{padding:7px 11px;border-right:1px solid var(--rib);display:grid;gap:1px;min-width:66px}
.gauges div:last-child{border-right:0}
.gauges span{font-size:10px;letter-spacing:.12em;color:var(--sodium)}
.gauges b{font-size:15px;font-weight:600}
.gauges b.bad{color:var(--alarm)}
.gauges i{font-style:normal;font-size:10px;color:var(--ink-dim);margin-left:2px}

.alert{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 84px);font-family:var(--f-mono);font-size:13px;letter-spacing:.14em;
  padding:9px 16px;border:1px solid var(--alarm);color:var(--alarm);background:rgba(40,6,12,.8);white-space:nowrap;animation:blink 1s steps(2) infinite;pointer-events:none}
.alert.warn{border-color:var(--sodium);color:var(--sodium);background:rgba(40,24,6,.8);animation:none}
@keyframes blink{50%{opacity:.45}}

.card{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 112px);max-width:min(360px,calc(100% - 32px));padding:12px 14px;display:grid;gap:6px;cursor:pointer;text-align:left;color:var(--ink);font:inherit}
.card .tag{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--sodium);display:flex;justify-content:space-between;gap:12px}
.card p{margin:0;font-size:14px;line-height:1.5;color:var(--ink)}
.card ul{margin:0;padding-left:18px;font-size:13px;color:var(--ink-dim);display:grid;gap:2px}
.card.min p,.card.min ul{display:none}

.weld{position:fixed;left:50%;top:58%;transform:translate(-50%,-50%);font-family:var(--f-mono);font-size:14px;letter-spacing:.06em;color:var(--ink);
  padding:14px 20px;border:1px solid var(--sodium);background:rgba(40,24,6,.85);display:grid;gap:8px;min-width:250px;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:none}
.weld .prog{height:6px;background:rgba(0,0,0,.5);position:relative;overflow:hidden}
.weld .prog i{position:absolute;inset:0 auto 0 0;width:0;background:var(--sodium)}
.weld.go{border-color:var(--glow);background:rgba(6,40,36,.85)}

.bottom{position:fixed;left:0;right:0;bottom:0;display:grid;gap:8px;
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 12px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;justify-content:center}
.row::-webkit-scrollbar{display:none}
.btn{flex:0 0 auto;font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);background:var(--hull);border:1px solid var(--rib);padding:10px 13px;cursor:pointer}
.btn:hover{border-color:var(--ink-dim)}
.btn.on{border-color:var(--glow);color:var(--glow)}
.btn.act{border-color:rgba(255,178,89,.55)}
.btn.act:hover{border-color:var(--sodium)}
.btn.danger{border-color:rgba(255,93,108,.6);color:#ffc2c8}
.btn.pulse{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{border-color:var(--alarm);color:var(--alarm);box-shadow:0 0 14px rgba(255,93,108,.5)}}
.btn:focus-visible,.weld:focus-visible,.card:focus-visible{outline:2px solid var(--sodium);outline-offset:2px}
.btn .k{color:var(--ink-dim);margin-right:6px}

.toast{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);font-family:var(--f-mono);font-size:14px;padding:12px 18px;border:1px solid var(--glow);color:var(--glow);background:rgba(4,30,30,.85);pointer-events:none;text-align:center;max-width:calc(100% - 32px)}
.err{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;font-size:15px;color:var(--ink)}

@media (max-width:640px){
  .gauges div{min-width:0;padding:6px 8px}
  .gauges b{font-size:13px}
  .id{display:none}
  .top{justify-content:center}
  .row{justify-content:flex-start}
  .btn{padding:9px 10px;font-size:11px}
  .card{bottom:calc(env(safe-area-inset-bottom,0px) + 104px)}
  .alert{font-size:11px;top:calc(env(safe-area-inset-top,0px) + 64px)}
  .btn .k{display:none}
}
@media (prefers-reduced-motion:reduce){.alert,.btn.pulse{animation:none}}
</style>

<div id="stage"></div>

<div class="top">
  <div class="id pane"><b>Ковчег-7</b><span>Талассия-IV · Кристальный лес</span></div>
  <div class="gauges pane" aria-live="off">
    <div><span>ГЛУБ</span><b id="g-dep">1240</b></div>
    <div><span>ДАВЛ</span><b id="g-pre">125</b></div>
    <div><span>O₂</span><b id="g-o2">92</b></div>
    <div><span>КОРПУС</span><b id="g-hull">100</b></div>
    <div><span>ШУМ</span><b id="g-noise">20</b></div>
  </div>
</div>

<div class="alert" id="alert" hidden></div>

<button class="card pane" id="card" type="button" aria-expanded="true">
  <span class="tag"><span id="card-role">Мостик</span><span id="card-tog">свернуть</span></span>
  <p id="card-text"></p>
  <ul id="card-list"></ul>
</button>

<div class="weld" id="weld" role="button" tabindex="0" hidden>
  <span id="weld-label">Удерживайте — сварка шва</span>
  <span class="prog"><i id="weld-bar"></i></span>
</div>

<div class="toast" id="toast" hidden></div>

<div class="bottom">
  <nav class="row" id="stations" aria-label="Посты экипажа"></nav>
  <div class="row">
    <button class="btn act" id="b-ping" type="button">Пинг сонара</button>
    <button class="btn act on" id="b-lamp" type="button">Прожектор</button>
    <button class="btn danger" id="b-breach" type="button">Пробоина</button>
    <button class="btn act" id="b-lev" type="button">Левиафан</button>
    <button class="btn" id="b-snd" type="button">Звук: выкл</button>
  </div>
</div>

<div class="err" id="err" hidden><p>Не удалось запустить 3D: браузер не поддерживает WebGL. Попробуйте Chrome на Android или компьютере.</p></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const $=id=>document.getElementById(id);
if(!window.THREE){$('err').hidden=false;return;}
const fontsReady=document.fonts&&document.fonts.ready?Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,1500))]):Promise.resolve();
fontsReady.then(init);

function init(){
const TAU=Math.PI*2,R=4,H=3;
const stage=$('stage');
let renderer;
try{renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});}catch(e){$('err').hidden=false;return;}
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.75));
stage.appendChild(renderer.domElement);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x021219);
scene.fog=new THREE.FogExp2(0x04232d,0.03);
const camera=new THREE.PerspectiveCamera(70,1,0.05,260);
camera.rotation.order='YXZ';
function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.fov=w<h?82:68;camera.updateProjectionMatrix();}
resize();addEventListener('resize',resize);

const polar=(th,r,y)=>new THREE.Vector3(r*Math.sin(th),y,r*Math.cos(th));
function ctex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');if(draw)draw(g,w,h);const t=new THREE.CanvasTexture(c);t.anisotropy=4;return{c,g,t};}
const F=(px,w)=>`${w||400} ${px}px "JetBrains Mono", ui-monospace, monospace`;

/* ---------------- interior: walls ---------------- */
const WW=4096,WH=512,PX=WW/(TAU*R),PY=WH/H;
const texX=th=>(1-(((th%TAU)+TAU)%TAU)/TAU)*WW;
const texY=y=>(H-y)/H*WH;
const ENG=3*Math.PI/2,BIO=Math.PI/2,FRONT=Math.PI,CRACK=ENG+0.25;
const ports=[
  {th:FRONT,y:1.7,r:0.95,main:true},
  {th:FRONT-0.55,y:1.8,r:0.38},{th:FRONT+0.55,y:1.8,r:0.38},
  {th:BIO,y:1.72,r:0.55},
  {th:ENG-0.55,y:1.9,r:0.3},
  {th:0.62,y:1.85,r:0.3},{th:TAU-0.62,y:1.85,r:0.3}
];
const wall=ctex(WW,WH,(g,w,h)=>{
  const gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,'#0b171c');gr.addColorStop(.45,'#1a2d34');gr.addColorStop(1,'#0f1b20');
  g.fillStyle=gr;g.fillRect(0,0,w,h);
  const pw=PX*0.9;
  for(let x=0;x<w;x+=pw){g.fillStyle='rgba(0,0,0,.38)';g.fillRect(x,0,10,h);g.fillStyle='rgba(140,190,200,.07)';g.fillRect(x+10,0,2,h);}
  [0.45,2.55].forEach(yy=>{const py=texY(yy);g.fillStyle='rgba(0,0,0,.45)';g.fillRect(0,py,w,6);g.fillStyle='rgba(140,190,200,.09)';g.fillRect(0,py+6,w,2);
    g.fillStyle='rgba(150,190,200,.28)';for(let x=20;x<w;x+=40){g.beginPath();g.arc(x,py-7,2.3,0,TAU);g.fill();}});
  g.fillStyle='rgba(0,0,0,.25)';g.fillRect(0,texY(0.45)+8,w,h);
  for(let i=0;i<3500;i++){g.fillStyle=`rgba(${Math.random()<.5?'0,0,0':'90,140,150'},${Math.random()*.06})`;g.fillRect(Math.random()*w,Math.random()*h,Math.random()*34,Math.random()*6);}
  // rust streaks under ports
  ports.forEach(p=>{const x=texX(p.th),y=texY(p.y-p.r);for(let k=0;k<6;k++){const sx=x+(Math.random()-.5)*p.r*PX*1.4;const lg=g.createLinearGradient(0,y,0,y+60+Math.random()*80);lg.addColorStop(0,'rgba(140,80,40,.22)');lg.addColorStop(1,'rgba(140,80,40,0)');g.fillStyle=lg;g.fillRect(sx,y,3+Math.random()*4,140);}});
  // hazard stripes at engineer
  const ex=texX(ENG),hy=texY(0.42);g.save();g.beginPath();g.rect(ex-300,hy,600,24);g.clip();
  for(let i=-14;i<14;i++){g.fillStyle=i%2?'#c98a3f':'#151515';g.beginPath();g.moveTo(ex+i*26,hy);g.lineTo(ex+i*26+26,hy);g.lineTo(ex+i*26+2,hy+24);g.lineTo(ex+i*26-24,hy+24);g.fill();}
  g.restore();
  // hatch at back (theta 0 is the texture seam)
  [0,w].forEach(x=>{const y=texY(1.15),rx=0.75*PX,ry=0.75*PY;
    g.fillStyle='#0d181c';g.beginPath();g.ellipse(x,y,rx,ry,0,0,TAU);g.fill();
    g.strokeStyle='#3c5d66';g.lineWidth=10;g.beginPath();g.ellipse(x,y,rx,ry,0,0,TAU);g.stroke();
    g.lineWidth=4;g.beginPath();g.ellipse(x,y,rx*.82,ry*.82,0,0,TAU);g.stroke();
    g.lineWidth=7;for(let a=0;a<6;a++){g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(a*TAU/6)*rx*.35,y+Math.sin(a*TAU/6)*ry*.35);g.stroke();}
    g.beginPath();g.ellipse(x,y,rx*.35,ry*.35,0,0,TAU);g.stroke();
    g.fillStyle='rgba(255,178,89,.6)';g.font=F(28,600);g.textAlign='center';g.fillText('ШЛЮЗ · ПОДЪЁМ',x,texY(2.12));});
  // labels
  g.textAlign='center';g.fillStyle='rgba(216,232,234,.38)';g.font=F(22,600);
  g.fillText('НОСОВОЙ ОБЗОР · Ø 1.9 м · КВАРЦ 280 мм',texX(FRONT),texY(2.78));
  g.fillText('ЩИТ ПИТАНИЯ · ОТСЕК Б-2',texX(ENG),texY(2.35));
  g.fillText('БОРТОВОЙ СКАНЕР ФАУНЫ',texX(BIO),texY(2.43));
  g.fillStyle='rgba(255,178,89,.28)';g.font='800 120px "Unbounded", "Arial Black", sans-serif';g.fillText('К-7',texX(ENG+0.85),texY(1.25));
  g.fillStyle='rgba(216,232,234,.25)';g.font=F(18);g.fillText('МАКС. ГЛУБИНА 11 000 м',texX(ENG+0.85),texY(0.95));
  // frame shadows then holes
  ports.forEach(p=>{g.fillStyle='rgba(0,0,0,.55)';g.beginPath();g.ellipse(texX(p.th),texY(p.y),(p.r+.16)*PX,(p.r+.16)*PY,0,0,TAU);g.fill();});
  g.globalCompositeOperation='destination-out';
  ports.forEach(p=>{g.beginPath();g.ellipse(texX(p.th),texY(p.y),p.r*PX,p.r*PY,0,0,TAU);g.fill();});
  g.globalCompositeOperation='source-over';
});
wall.t.wrapS=THREE.RepeatWrapping;wall.t.repeat.x=-1;
const wallMesh=new THREE.Mesh(new THREE.CylinderGeometry(R,R,H,128,1,true),new THREE.MeshStandardMaterial({map:wall.t,side:THREE.BackSide,alphaTest:.5,roughness:.75,metalness:.35}));
wallMesh.position.y=H/2;scene.add(wallMesh);

const metal=new THREE.MeshStandardMaterial({color:0x3d5f68,metalness:.85,roughness:.35});
const darkMetal=new THREE.MeshStandardMaterial({color:0x14242a,metalness:.6,roughness:.55});
const boltGeo=new THREE.SphereGeometry(0.022,8,6);
ports.forEach(p=>{
  const tube=p.main?0.11:0.07;
  const fr=new THREE.Mesh(new THREE.TorusGeometry(p.r,tube,14,64),metal);
  fr.position.copy(polar(p.th,p.main?3.82:3.86,p.y));fr.lookAt(0,p.y,0);scene.add(fr);
  const n=p.main?20:12;for(let k=0;k<n;k++){const a=k/n*TAU;const b=new THREE.Mesh(boltGeo,metal);b.position.set(Math.cos(a)*p.r,Math.sin(a)*p.r,tube*.95);fr.add(b);}
  const gl=new THREE.Mesh(new THREE.CircleGeometry(p.r,48),new THREE.MeshBasicMaterial({color:0x7ff0e6,transparent:true,opacity:.05,depthWrite:false,side:THREE.DoubleSide}));
  gl.position.copy(polar(p.th,3.9,p.y));gl.lookAt(0,p.y,0);scene.add(gl);
});

/* floor & ceiling */
const floorT=ctex(1024,1024,(g,w,h)=>{g.fillStyle='#0b1519';g.fillRect(0,0,w,h);
  g.strokeStyle='rgba(120,170,180,.10)';g.lineWidth=2;for(let i=0;i<w;i+=22){g.beginPath();g.moveTo(i,0);g.lineTo(i,h);g.stroke();g.beginPath();g.moveTo(0,i);g.lineTo(w,i);g.stroke();}
  g.strokeStyle='rgba(0,0,0,.7)';g.lineWidth=10;[.2,.42,.7].forEach(r=>{g.beginPath();g.arc(w/2,h/2,r*w/2,0,TAU);g.stroke();});
  for(let a=0;a<12;a++){g.beginPath();g.moveTo(w/2+Math.cos(a*TAU/12)*w*.21,h/2+Math.sin(a*TAU/12)*h*.21);g.lineTo(w/2+Math.cos(a*TAU/12)*w/2,h/2+Math.sin(a*TAU/12)*h/2);g.stroke();}
  for(let i=0;i<1500;i++){g.fillStyle=`rgba(0,0,0,${Math.random()*.15})`;g.fillRect(Math.random()*w,Math.random()*h,Math.random()*20,Math.random()*20);}});
const floor=new THREE.Mesh(new THREE.CircleGeometry(R,96),new THREE.MeshStandardMaterial({map:floorT.t,metalness:.6,roughness:.6}));
floor.rotation.x=-Math.PI/2;scene.add(floor);
const ceil=new THREE.Mesh(new THREE.CircleGeometry(R,96),new THREE.MeshStandardMaterial({color:0x0b161a,metalness:.4,roughness:.8}));
ceil.rotation.x=Math.PI/2;ceil.position.y=H;scene.add(ceil);
[[3.72,.08,2.82],[3.6,.055,2.93],[3.78,.05,0.18]].forEach(([r,t,y])=>{const p=new THREE.Mesh(new THREE.TorusGeometry(r,t,10,128),metal);p.rotation.x=Math.PI/2;p.position.y=y;scene.add(p);});
const pipeRed=new THREE.MeshStandardMaterial({color:0x7a3424,metalness:.6,roughness:.5}),pipeYel=new THREE.MeshStandardMaterial({color:0x6f5a26,metalness:.6,roughness:.5});
[[ENG-0.42,pipeRed,.09],[ENG-0.36,pipeYel,.06],[ENG+0.48,pipeRed,.07],[FRONT-0.95,metal,.06],[FRONT+0.95,metal,.06],[BIO+0.6,pipeYel,.07]].forEach(([th,m,r])=>{const c=new THREE.Mesh(new THREE.CylinderGeometry(r,r,H,14),m);c.position.copy(polar(th,3.82,H/2));scene.add(c);});
const lampMat=new THREE.MeshBasicMaterial({color:0xffc27a});
const lamps=[];
for(let k=0;k<3;k++){const a=k*TAU/3+Math.PI/3;const b=new THREE.Mesh(new THREE.BoxGeometry(0.6,0.04,0.14),lampMat);b.position.copy(polar(a,2.3,2.97));b.rotation.y=a;scene.add(b);
  const l=new THREE.PointLight(0xffb259,0.9,7.5,2);l.position.copy(polar(a,2.3,2.7));scene.add(l);lamps.push(l);}

/* lights */
scene.add(new THREE.AmbientLight(0x2a4650,0.85));
scene.add(new THREE.HemisphereLight(0x3b8a99,0x0a0f12,0.35));
const portLight=new THREE.PointLight(0x3fb8c8,1.1,6,2);portLight.position.copy(polar(FRONT,3.3,1.8));scene.add(portLight);
const bioLight=new THREE.PointLight(0x3fb8c8,0.6,4,2);bioLight.position.copy(polar(BIO,3.4,1.7));scene.add(bioLight);
const alarmLight=new THREE.PointLight(0xff2a3a,0,10,2);alarmLight.position.set(0,2.7,0);scene.add(alarmLight);

/* ---------------- holotable (sonar) ---------------- */
const TZ=0.3;
const tbl=new THREE.Mesh(new THREE.CylinderGeometry(0.76,0.6,0.95,48),darkMetal);tbl.position.set(0,0.475,TZ);scene.add(tbl);
const tRing=new THREE.Mesh(new THREE.TorusGeometry(0.73,0.022,8,72),new THREE.MeshBasicMaterial({color:0x5ef2d6}));tRing.rotation.x=Math.PI/2;tRing.position.set(0,0.955,TZ);scene.add(tRing);
const tDisk=new THREE.Mesh(new THREE.CircleGeometry(0.66,64),new THREE.MeshBasicMaterial({color:0x0b3a3e}));tDisk.rotation.x=-Math.PI/2;tDisk.position.set(0,0.958,TZ);scene.add(tDisk);
const tLight=new THREE.PointLight(0x5ef2d6,1.1,3.5,2);tLight.position.set(0,1.25,TZ);scene.add(tLight);
const holo=new THREE.Group();holo.position.set(0,1.0,TZ);scene.add(holo);
const beam=new THREE.Mesh(new THREE.CylinderGeometry(0.62,0.64,0.3,48,1,true),new THREE.MeshBasicMaterial({color:0x5ef2d6,transparent:true,opacity:.05,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide}));
beam.position.y=0.12;holo.add(beam);
const hp=[];for(let x=-0.6;x<=0.6;x+=0.024)for(let z=-0.6;z<=0.6;z+=0.024)if(x*x+z*z<0.36)hp.push(x,z);
const HN=hp.length/2,hPos=new Float32Array(HN*3),hCol=new Float32Array(HN*3);
