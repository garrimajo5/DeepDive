<!doctype html>
<html><head><meta charset="utf-8"></head>
<body style="margin:0;background:#000">
<canvas id="c"></canvas>
<script>
const COMMON = `#version 300 es
precision highp float;
uniform vec2 uRes; uniform float uTime;
out vec4 fragColor;
#define PI 3.14159265
float h21(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float h31(vec3 p){p=fract(p*0.3183099+.1);p*=17.0;return fract(p.x*p.y*p.z*(p.x+p.y+p.z));}
float noise(vec3 x){vec3 i=floor(x),f=fract(x);f=f*f*(3.-2.*f);
 return mix(mix(mix(h31(i),h31(i+vec3(1,0,0)),f.x),mix(h31(i+vec3(0,1,0)),h31(i+vec3(1,1,0)),f.x),f.y),
            mix(mix(h31(i+vec3(0,0,1)),h31(i+vec3(1,0,1)),f.x),mix(h31(i+vec3(0,1,1)),h31(i+vec3(1,1,1)),f.x),f.y),f.z);}
float fbm(vec3 p){float s=0.,a=.5;for(int i=0;i<5;i++){s+=a*noise(p);p=p*2.03+vec3(1.7,9.2,3.1);a*=.5;}return s;}
float fbm3(vec3 p){float s=0.,a=.5;for(int i=0;i<3;i++){s+=a*noise(p);p=p*2.03+vec3(1.7,9.2,3.1);a*=.5;}return s;}
float sdCapsule(vec3 p,vec3 a,vec3 b,float r){vec3 pa=p-a,ba=b-a;float h=clamp(dot(pa,ba)/dot(ba,ba),0.,1.);return length(pa-ba*h)-r;}
float sdEllipsoid(vec3 p,vec3 r){float k0=length(p/r);float k1=length(p/(r*r));return k0*(k0-1.)/max(k1,1e-4);}
float smin(float a,float b,float k){float h=clamp(.5+.5*(b-a)/k,0.,1.);return mix(b,a,h)-k*h*(1.-h);}
mat2 rot(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}
mat3 camMat(vec3 ro,vec3 ta){vec3 f=normalize(ta-ro),r=normalize(cross(f,vec3(0,1,0))),u=cross(r,f);return mat3(r,u,f);}
vec3 aces(vec3 x){return clamp((x*(2.51*x+.03))/(x*(2.43*x+.59)+.14),0.,1.);}
float caustic(vec2 uv,float time){
  vec2 p=mod(uv*6.28318,6.28318)-250.;vec2 i=p;float c=1.;float inten=.005;
  for(int n=0;n<5;n++){float t=time*(1.-(3.5/float(n+1)));i=p+vec2(cos(t-i.x)+sin(t+i.y),sin(t-i.y)+cos(t+i.x));
    c+=1./length(vec2(p.x/(sin(i.x+t)/inten),p.y/(cos(i.y+t)/inten)));}
  c/=5.;c=1.17-pow(c,1.4);return pow(abs(c),8.);}
float vEdge(vec2 p){vec2 n=floor(p),f=fract(p),mg,mr;float md=8.;
  for(int j=-1;j<=1;j++)for(int i=-1;i<=1;i++){vec2 g=vec2(i,j),o=vec2(h21(n+g),h21(n+g+19.7)),r=g+o-f;float d=dot(r,r);if(d<md){md=d;mr=r;mg=g;}}
  md=8.;for(int j=-2;j<=2;j++)for(int i=-2;i<=2;i++){vec2 g=mg+vec2(i,j),o=vec2(h21(n+g),h21(n+g+19.7)),r=g+o-f;if(dot(mr-r,mr-r)>1e-5)md=min(md,dot(.5*(mr+r),normalize(r-mr)));}
  return md;}
float iceHoles(vec2 uv){return smoothstep(.6,.86,fbm3(vec3(uv*.035,5.)));}
float iceLines(vec2 uv){vec2 w=uv*.09+.9*vec2(fbm3(vec3(uv*.05,1.)),fbm3(vec3(uv*.05,7.)));return smoothstep(.03,.0,vEdge(w))*smoothstep(.4,.65,fbm3(vec3(uv*.03,9.)));}
float cracks(vec2 uv){float soft=.25+.75*fbm3(vec3(uv*.07,3.));return soft*.45+iceLines(uv)*1.1+iceHoles(uv)*2.4;}
float shaftSrc(vec2 uv){return iceHoles(uv)*1.3+iceLines(uv)*.5+.04;}
vec3 snow(vec3 ro,vec3 rd,float tmax,vec3 tint){vec3 acc=vec3(0);
  for(int k=0;k<14;k++){float z=.8+float(k)*1.3;if(z>tmax)break;vec3 p=ro+rd*z;vec3 c=floor(p*1.1);
    if(h31(c+3.3)<.55)continue;vec3 sp=(c+vec3(h31(c),h31(c+7.1),h31(c+13.7)))/1.1;float al=dot(sp-ro,rd);if(al<.4)continue;
    float d=length(cross(sp-ro,rd));float s=.006+.012/al;acc+=tint*smoothstep(s,0.,d)*exp(-al*.12)*(s<.02?1.:.25);}
  return acc;}
float sdHex(vec3 p,vec2 h){const vec3 k=vec3(-0.8660254,0.5,0.57735);p=abs(p);p.xy-=2.0*min(dot(k.xy,p.xy),0.0)*k.xy;
  vec2 d=vec2(length(p.xy-vec2(clamp(p.x,-k.z*h.x,k.z*h.x),h.x))*sign(p.y-h.x),p.z-h.y);return min(max(d.x,d.y),0.0)+length(max(d,0.0));}
vec3 post(vec3 col,vec2 fc,float expo){col=aces(col*expo);col=pow(col,vec3(1./2.2));
  vec2 q=fc/uRes;col*=.55+.45*pow(16.*q.x*q.y*(1.-q.x)*(1.-q.y),.22);col+=(h21(fc+fract(uTime))-.5)*.025;return col;}
`;

const SCENES = [];

/* ======================== A. Риф под льдом: огнецвет ======================== */
SCENES.push(`
const float ICE=9.0;
const vec3 SUN=normalize(vec3(.25,1.,.12));
const vec3 ABSC=vec3(.22,.07,.055);
vec3 gCol; float gTip; bool gNoIce=false;
float terrain(vec2 xz){return -2.6+2.6*fbm(vec3(xz*.15,.5))+.15*noise(vec3(xz*1.7,2.));}
float coral(vec3 p){
  vec2 cell=floor(p.xz/4.);vec3 q=p;q.xz=mod(p.xz,4.)-2.;float r=h21(cell);gTip=1e3;
  vec2 qq=abs(q.xz);if(length((cell+.5)*4.-vec2(.8,-3.))<4.2)return max(2.05-max(qq.x,qq.y),.05);
  if(r<.32){vec3 m=q;m.y-=terrain(cell*4.+2.)-.2;float rr=.7+.9*h21(cell+2.2);float d=sdEllipsoid(m,vec3(rr,rr*.62,rr*1.1))+.06*noise(m*9.)+.04*sin(m.x*14.+sin(m.z*12.)*2.);
    gCol=h21(cell+4.)<.5?vec3(.55,.42,.75):vec3(.75,.5,.3);gTip=1e3;return min(d,2.05-max(qq.x,qq.y)+.3);}
  vec2 off=(vec2(h21(cell+3.1),h21(cell+7.7))-.5)*1.1;q.xz-=off;
  q.y-=terrain(cell*4.+2.+off)-.15;float sc=.8+.75*h21(cell+11.3);q/=sc;q.xz*=rot(r*6.28);
  if(length(q-vec3(0,1.4,0))>2.6)return (length(q-vec3(0,1.4,0))-2.4)*sc;
  float d=sdCapsule(q,vec3(0),vec3(0,1.,0),.11);vec3 b=vec3(0,1,0);
  for(int i=0;i<3;i++){float fi=float(i),ang=fi*2.094+r*3.;vec3 c1=b+normalize(vec3(cos(ang)*.8,1.,sin(ang)*.8))*.85;
    d=smin(d,sdCapsule(q,b,c1,.075),.06);
    for(int j=0;j<3;j++){float a2=ang+(float(j)-1.)*.95;vec3 c2=c1+normalize(vec3(cos(a2)*.6,1.,sin(a2)*.6))*(.5+.25*h21(cell+fi*3.+float(j)));
      d=smin(d,sdCapsule(q,c1,c2,.048),.035);vec3 c3=c2+normalize(vec3(cos(a2*1.7)*.5,1.,sin(a2*1.3)*.5))*.3;d=smin(d,sdCapsule(q,c2,c3,.032),.02);
      gTip=min(gTip,length(q-c3)-.06);}}
  d+=.012*noise(q*30.);
  gTip*=sc;
  float hc=h21(cell+5.);gCol=hc<.45?vec3(.95,.16,.38):hc<.75?vec3(1.,.45,.1):vec3(.6,.25,.95);
  return d*sc;}
vec2 map(vec3 p){
  float dt=(p.y-terrain(p.xz))*.7;vec2 res=vec2(dt,1.);
  float dc=coral(p);if(dc<res.x)res=vec2(dc,gTip<=dc+.002?3.:2.);
  if(!gNoIce){float di=ICE-p.y+.4*noise(vec3(p.xz*.25,1.));if(di<res.x)res=vec2(di,4.);}
  return res;}
vec3 nrm(vec3 p){vec2 e=vec2(.002,0);return normalize(vec3(map(p+e.xyy).x-map(p-e.xyy).x,map(p+e.yxy).x-map(p-e.yxy).x,map(p+e.yyx).x-map(p-e.yyx).x));}
float shadow(vec3 ro,vec3 rd){gNoIce=true;float res=1.,t=.06;for(int i=0;i<40;i++){float h=map(ro+rd*t).x;res=min(res,8.*h/t);t+=clamp(h,.04,.6);if(res<.01||t>9.)break;}gNoIce=false;return clamp(res,0.,1.);}
float ao(vec3 p,vec3 n){float o=0.,s=1.;for(int i=1;i<6;i++){float h=.08*float(i);o+=(h-map(p+n*h).x)*s;s*=.75;}return clamp(1.-1.6*o,0.,1.);}
vec3 waterCol(vec3 rd){return mix(vec3(.003,.035,.06),vec3(.03,.26,.36),smoothstep(-.4,.8,rd.y));}
vec3 god(vec3 ro,vec3 rd,float tmax){vec3 acc=vec3(0);const float N=56.;float dt=min(tmax,45.)/N;float j=h21(gl_FragCoord.xy);
  for(float i=0.;i<N;i++){vec3 p=ro+rd*(i+j)*dt;if(p.y>ICE)break;float up=(ICE-p.y)/SUN.y;vec2 uv=p.xz+SUN.xz*up;
    float L=shaftSrc(uv);acc+=L*exp(-ABSC*(up+(i+j)*dt))*dt;}
  float ph=.35+.65*pow(max(dot(rd,SUN),0.),2.);return acc*vec3(.55,.95,1.)*.3*ph;}
vec3 render(vec2 uv){
  vec3 ro=vec3(.8,0.,-3.);ro.y=terrain(ro.xz)+1.25;vec3 ta=vec3(2.5,2.6,10.);
  vec3 rd=camMat(ro,ta)*normalize(vec3(uv,1.45));
  float t=.05;vec2 h;bool hit=false;vec3 glowAcc=vec3(0);
  for(int i=0;i<220;i++){vec3 p=ro+rd*t;h=map(p);glowAcc+=(gCol+.4)*(.009/(1.+gTip*gTip*45.))*exp(-t*.06);if(h.x<.0012*t){hit=true;break;}t+=min(h.x,.9);if(t>70.)break;}
  vec3 wc=waterCol(rd);vec3 col;
  if(hit){vec3 p=ro+rd*t;h=map(p);vec3 n=nrm(p);
    if(h.y>3.5){col=vec3(.6,.9,1.)*cracks(p.xz)*2.;}
    else{float depth=ICE-p.y;vec3 sunc=vec3(1.,.97,.9)*3.6*exp(-ABSC*depth*.45);
      float sh=shadow(p+n*.03,SUN),dif=max(dot(n,SUN),0.),ca=caustic(p.xz*.11,uTime*.6),oc=ao(p,n);
      vec3 alb=h.y<1.5?mix(vec3(.66,.6,.48),vec3(.38,.36,.33),smoothstep(.3,.8,noise(p*1.3)))*(.8+.35*noise(p*7.)):gCol*(.55+.45*noise(p*9.));
      vec3 lv=ro-p;float ld=length(lv);vec3 fl=vec3(1.,.93,.82)*45./(ld*ld+3.)*max(dot(n,lv/ld),0.)*smoothstep(.75,.95,dot(-lv/ld,camMat(ro,vec3(2.5,2.6,10.))[2]));
      vec3 lit=sunc*dif*sh*(.5+2.2*ca)+waterCol(n)*2.4*oc+vec3(.0,.03,.04)*oc+fl*exp(-vec3(.3,.075,.055)*ld);
      if(h.y>1.5){float sss=pow(clamp(1.+dot(rd,n),0.,1.),2.);lit+=gCol*sss*.8;}
      col=alb*lit;if(h.y>2.5)col=gCol*1.2+vec3(1.,.8,.95)*2.6;}
    vec3 tr=exp(-ABSC*t*.6);col=col*tr+wc*(1.-tr);
  }else col=wc;
  col+=god(ro,rd,hit?t:70.);col+=glowAcc*2.2;col+=snow(ro,rd,hit?t:70.,vec3(.7,.9,.95))*.9;
  return post(col,gl_FragCoord.xy,1.15);}
`);

/* ======================== B. Фонарная вуаль ======================== */
SCENES.push(`
vec3 jelly(vec3 p,out float dmin){
  float s=1.+.04*sin(uTime*1.3);vec3 q=p*vec3(1./s,s,1./s);
  float a=atan(q.z,q.x);float rip=.08*sin(a*26.)*smoothstep(.8,-.4,q.y);
  vec3 qb=q*vec3(1.,1.3,1.);float rr=length(qb);
  float dB=max(abs(rr-3.-rip)-.05,-(q.y+.35));
  float dG=1e3;for(int k=0;k<4;k++){vec3 g=q;g.xz*=rot(float(k)*1.5708+.3);g-=vec3(1.05,.55,0.);dG=min(dG,sdEllipsoid(g,vec3(.35,.28,.75)));}
  float canal=pow(abs(cos(a*8.)),60.)*smoothstep(-.3,2.5,q.y);
  vec3 qr=q-vec3(0,-.35,0);float rimR=2.95+rip;float dRim=length(vec2(length(qr.xz)-rimR,qr.y))-.07;
  float rimDot=smoothstep(.2,.0,abs(fract(a/6.2831*64.)-.5)-.25);
  float N=40.,sec=6.2831/N,ida=floor((a+sec*.5)/sec);float aa=a-ida*sec;float R=length(q.xz);
  vec2 lq=vec2(R*cos(aa),R*sin(aa));float y=q.y;
  float hid=fract(sin(ida*12.9)*437.5);float len=8.+9.*hid;float f=clamp(-y/len,0.,1.);
  float sx=(.9*sin(y*.32+ida*1.7+uTime*.6)+.25*sin(y*1.1+ida))*f,sz=(.8*cos(y*.27+ida*2.3+uTime*.5))*f;
  float dT=length(vec2(lq.x-2.8+.5*f-sx,lq.y-sz))-.018-.02*(1.-f);dT=max(dT,max(y+.3,-(y+len)));
  float dA=1e3;for(int k=0;k<4;k++){vec3 pk=q;pk.xz*=rot(float(k)*1.5708+.4);float cx=.5+.45*sin(pk.y*.55+float(k)),cz=.3*cos(pk.y*.45+float(k)*2.);
    float w=.2+.13*sin(pk.y*4.+float(k))+.05*sin(pk.y*13.);float d=length(vec2((pk.x-cx),(pk.z-cz)*2.6))-w;d=max(d,max(pk.y+.4,-(pk.y+9.5)));dA=min(dA,d);}
  dmin=min(min(min(dB,dT),min(dA,dRim)),dG);
  vec3 e=vec3(0);
  e+=vec3(.22,.7,1.)*exp(-max(dB,0.)*34.)*(.2+1.3*canal);
  e+=vec3(1.,.4,.7)*exp(-max(dG,0.)*9.)*.5;
  e+=vec3(.85,1.,1.)*exp(-max(dRim,0.)*26.)*(.35+2.4*rimDot);
  e+=vec3(.95,.45,.9)*exp(-max(dT,0.)*60.)*.75*(1.-f*.85);
  e+=vec3(1.,.55,.72)*exp(-max(dA,0.)*20.)*.16;
  return e;}
vec3 render(vec2 uv){
  vec3 ro=vec3(-4.,-.6,-11.),ta=vec3(0.,-2.6,0.);vec3 rd=camMat(ro,ta)*normalize(vec3(uv,1.45));
  vec3 bg=mix(vec3(.001,.01,.026),vec3(.02,.13,.22),smoothstep(-.6,.9,rd.y));
  float sh=fbm3(vec3(rd.x*4./(rd.y+1.3),0.,1.));bg+=vec3(.05,.2,.25)*pow(sh,3.)*smoothstep(.0,.9,rd.y);
  vec3 acc=vec3(0);float T=1.;float t=4.;float j=h21(gl_FragCoord.xy);
  for(int i=0;i<500;i++){vec3 p=ro+rd*t;float dm=1.;vec3 e=vec3(0);
    if(length(p.xz)<7.5&&p.y<4.5&&p.y>-19.)e=jelly(p,dm);
    float st=clamp(dm*.45,.015,.3)*(.85+.3*j);acc+=e*T*st*1.5;T*=exp(-length(e)*st*.2);t+=st;if(t>28.||T<.02)break;}
  vec3 col=bg*T+acc;
  for(int k=0;k<3;k++){vec3 c=vec3(-9.+float(k)*8.,2.-float(k)*2.5,10.+float(k)*5.);vec3 oc=c-ro;float al=dot(oc,rd);float d=length(oc-rd*al);col+=vec3(.25,.6,.95)*.06/(1.+d*d*.5)*exp(-al*.05);}
  col+=snow(ro,rd,28.,vec3(.5,.8,.9))*1.1;
  return post(col,gl_FragCoord.xy,1.3);}
`);

/* ======================== C. Ледокрыл подо льдом ======================== */
SCENES.push(`
const float ICE=11.5;const vec3 SUN=normalize(vec3(-.2,1.,.25));const vec3 ABSC=vec3(.26,.065,.05);
float gAx;
float manta(vec3 p){p-=vec3(-.5,7.3,8.5);p.xz*=rot(.55);
  float ax=abs(p.x);float flap=.5;p.y-=ax*ax*.035*flap+ax*.06;gAx=ax;
  float f=pow(ax/6.6,1.15)+abs(p.z+ax*.32-.3)/(2.4-ax*.18)-1.;float th=.38*(1.-clamp(ax/6.6,0.,1.))+.03;
  float wing=max(f*1.6,abs(p.y)-th);
  float body=sdEllipsoid(p-vec3(0,0,.3),vec3(1.3,.45,2.1));float d=smin(wing,body,.6);
  vec3 q=vec3(ax,p.y,p.z);d=min(d,sdCapsule(q,vec3(.55,-.05,2.1),vec3(.7,-.35,2.9),.13));
  d=min(d,sdCapsule(p,vec3(0,0,-1.6),vec3(0,.15,-4.8),.05));
  return d;}
float fish(vec3 p){vec3 c=vec3(-4.,6.3,12.);vec3 q=p-c;if(length(q)>6.)return length(q)-5.5;
  vec3 id=floor(q/1.1);vec3 l=mod(q,1.1)-.55;if(h31(id)<.45||length(id)>4.5)return .5;
  l-=(vec3(h31(id+1.),h31(id+2.),h31(id+3.))-.5)*.5;l.xz*=rot(.5);return sdEllipsoid(l,vec3(.07,.06,.24));}
vec2 map(vec3 p){vec2 r=vec2(manta(p),1.);float f=fish(p);if(f<r.x)r=vec2(f,2.);float di=ICE-p.y+.5*noise(vec3(p.xz*.2,2.));if(di<r.x)r=vec2(di,3.);return r;}
vec3 nrm(vec3 p){vec2 e=vec2(.003,0);return normalize(vec3(map(p+e.xyy).x-map(p-e.xyy).x,map(p+e.yxy).x-map(p-e.yxy).x,map(p+e.yyx).x-map(p-e.yyx).x));}
vec3 waterCol(vec3 rd){return mix(vec3(.002,.03,.05),vec3(.04,.3,.4),smoothstep(-.1,1.,rd.y));}
vec3 god(vec3 ro,vec3 rd,float tmax){vec3 acc=vec3(0);const float N=64.;float dt=min(tmax,40.)/N;float j=h21(gl_FragCoord.xy);
  for(float i=0.;i<N;i++){vec3 p=ro+rd*(i+j)*dt;if(p.y>ICE)break;float up=(ICE-p.y)/SUN.y;vec2 uv=p.xz+SUN.xz*up;float L=shaftSrc(uv);
    float occ=1.;vec3 s=p;for(int k=0;k<4;k++){s+=SUN*1.2;if(manta(s)<.2){occ=0.;break;}}
    acc+=L*occ*exp(-ABSC*(up+(i+j)*dt))*dt;}
  return acc*vec3(.6,.95,1.)*.2*(.4+.6*pow(max(dot(rd,SUN),0.),2.));}
vec3 render(vec2 uv){
  vec3 ro=vec3(1.,1.,1.5),ta=vec3(-.6,7.,9.);vec3 rd=camMat(ro,ta)*normalize(vec3(uv,1.25));
  float t=.1;vec2 h;bool hit=false;for(int i=0;i<200;i++){h=map(ro+rd*t);if(h.x<.001*t){hit=true;break;}t+=h.x*.8;if(t>60.)break;}
  vec3 wc=waterCol(rd),col;
  if(hit){vec3 p=ro+rd*t;vec3 n=nrm(p);
    if(h.y>2.5)col=vec3(.62,.92,1.)*cracks(p.xz)*2.6;
    else{float down=max(-n.y,0.),up=max(n.y,0.);
      vec3 alb=h.y<1.5?mix(vec3(.32,.38,.42),vec3(.06,.08,.1),up):vec3(.06,.08,.1);
      if(h.y<1.5){float sp=smoothstep(.7,.76,noise(p*7.));alb=mix(alb,vec3(.08,.1,.12),sp*down*.7);}
      vec3 lit=waterCol(n)*.9+vec3(.6,.9,1.)*up*1.2*exp(-ABSC*(ICE-p.y));
      if(h.y<1.5){manta(p);float th=.3*(1.-clamp(gAx/6.6,0.,1.))+.035;lit+=vec3(.25,.65,.75)*exp(-th*9.)*2.2*down;}
      float fr=pow(1.-max(dot(-rd,n),0.),4.);lit+=wc*fr*2.;col=alb*lit;}
    vec3 tr=exp(-ABSC*t*.55);col=col*tr+wc*(1.-tr);
  }else col=wc;
  col+=god(ro,rd,hit?t:60.);col+=snow(ro,rd,hit?t:60.,vec3(.7,.92,1.));
  return post(col,gl_FragCoord.xy,.95);}
`);

/* ======================== D. Кристальный лес ======================== */
SCENES.push(`
vec3 gEmi;float gC;
float ground(vec3 p){return p.y+1.5-1.6*fbm3(vec3(p.xz*.12,1.))-.25*noise(p*1.4);}
float crystals(vec3 p){vec2 cell=floor(p.xz/3.6);float best=1e3;
  for(int j=0;j<2;j++)for(int i=0;i<2;i++){vec2 c=cell+vec2(i,j)-.5+.5;c=floor(p.xz/3.6+vec2(i,j)-.5);
    float r=h21(c);if(r<.25)continue;vec3 q=p;q.xz-=(c+.5)*3.6+(vec2(h21(c+2.),h21(c+5.))-.5)*1.4;q.y+=1.2;
    float hgt=1.5+7.*pow(h21(c+9.),1.6);float rad=.35+.55*h21(c+13.);
    q.xy*=rot((h21(c+17.)-.5)*.5);q.zy*=rot((h21(c+21.)-.5)*.5);q.xz*=rot(r*6.);
    float d=sdHex(q.xzy-vec3(0,0,hgt*.5),vec2(rad,hgt*.5));d=max(d,(q.y-hgt)+length(q.xz)*1.4-rad*.4);best=min(best,d);}
  return best;}

/* ======================== E. Левиафан в Поющих каньонах ======================== */
SCENES.push(`

/* ======================== F. Хранитель в Городе раковин ======================== */
SCENES.push(`
float gEye;

/* ======================== G. Сердце ======================== */
SCENES.push(`
float gC;
float ground(vec3 p){return p.y+1.8-1.4*fbm3(vec3(p.xz*.15,2.))-.3*noise(p*1.2);}
float heart(vec3 p){vec3 c=vec3(0.,-1.,16.);float best=1e3;for(int i=0;i<9;i++){float fi=float(i);vec3 q=p-c;
  q.xz-=vec2(sin(fi*2.4),cos(fi*2.4))*(fi==0.?0.:1.2+fi*.25);float hgt=fi==0.?14.:4.+6.*fract(sin(fi*7.3)*43.);float rad=fi==0.?1.6:.5+.5*fract(sin(fi*3.1)*91.);

  col+=em;
  return post(col,gl_FragCoord.xy,.85);}
`);

const MAIN = `void main(){vec2 uv=(gl_FragCoord.xy-.5*uRes)/uRes.y;fragColor=vec4(render(uv),1.);}`;

const cv=document.getElementById('c');
const gl=cv.getContext('webgl2',{preserveDrawingBuffer:true,antialias:false});
function compile(src,type){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));return s;}
const VS=`#version 300 es
in vec2 p;void main(){gl_Position=vec4(p,0,1);}`;
window.renderScene=async function(i,W,H,time,tiles){
  cv.width=W;cv.height=H;gl.viewport(0,0,W,H);
  const prog=gl.createProgram();gl.attachShader(prog,compile(VS,gl.VERTEX_SHADER));gl.attachShader(prog,compile(COMMON+SCENES[i]+MAIN,gl.FRAGMENT_SHADER));gl.linkProgram(prog);

  const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);

  gl.uniform2f(gl.getUniformLocation(prog,'uRes'),W,H);gl.uniform1f(gl.getUniformLocation(prog,'uTime'),time||3.);

  for(let y=0;y<H;y+=th){gl.scissor(0,y,W,th);gl.drawArrays(gl.TRIANGLES,0,3);gl.finish();await new Promise(r=>setTimeout(r,0));}
  return cv.toDataURL('image/png');
};
window.nScenes=SCENES.length;
