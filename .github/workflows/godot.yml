name: Godot
# Тесты (свой раннер tests/run.gd) и сборка APK. После слияния в main APK выкладывается в релиз apk-latest.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2
  GODOT_URL: https://github.com/godotengine/godot/releases/download/4.7.2-stable

concurrency:
  group: godot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # PR и пуши без кода (черновики художника art/, отчёты тестера qa/, *.md, картинки и html в docs/) тесты и APK пропускают.
  # Пропущенный job GitHub считает успехом, поэтому такая PR сразу готова к слиянию. Ручной запуск гоняет всё.
  changes:
    name: Что изменилось
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - name: Есть ли изменения кода
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # PR: файлы PR — это уже разница с merge-base с main, влитый main кода не добавляет (#1350; JSON в docs/
          # — код: его читают тесты). main: от коммита последнего зелёного прогона «Godot» на main, а не от прошлого
          # пуша — иначе код отменённого прогона уходит непроверенным, если следом слит коммит без кода.
          if [ "$EVENT" = "pull_request" ]; then
            files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename')
          elif [ "$EVENT" = "push" ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            base=$(gh api "repos/$REPO/actions/workflows/godot.yml/runs?branch=main&status=success&per_page=1" \
              --jq '.workflow_runs[0].head_sha // empty' || true)
            [ -z "$base" ] && base="$BEFORE"
            echo "База сравнения: ${base::7} (последний зелёный прогон main; прошлый пуш — ${BEFORE::7})"
            files=$(gh api "repos/$REPO/compare/$base...$SHA" --jq '.files[].filename')
          else
            echo "code=true" >> "$GITHUB_OUTPUT"; echo "Ручной запуск — проверяем всё"; exit 0
          fi
          code=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              art/*|qa/*|*.md|docs/*.png|docs/*.jpg|docs/*.jpeg|docs/*.webp|docs/*.html) echo "  не код: $f" ;;
              *) echo "  код:    $f"; code=true ;;
            esac
          done <<< "$files"
          # compare отдаёт не больше 300 файлов: на огромном пуше лучше проверить всё
          [ "$(printf '%s\n' "$files" | grep -c .)" -ge 300 ] && code=true
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Изменения кода: $code"

  # Тесты — тремя частями параллельно (#845): файлы делятся по сумме времени из tests/vremya.txt (TestShards).
  test-parts:
    name: Тесты (часть ${{ matrix.part }} из 3)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5
      - name: Godot из кэша
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux
      - name: Скачать Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          curl -sSL -o g.zip "$GODOT_URL/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q g.zip && rm g.zip && mv Godot_v*_linux.x86_64 godot
      - name: Кэш импорта (.godot)
        uses: actions/cache@v4
        with:
          path: .godot
          key: godot-import-${{ env.GODOT_VERSION }}-${{ hashFiles('project.godot', '**/*.import', 'models/**', 'art/**/*.glb') }}
          restore-keys: godot-import-${{ env.GODOT_VERSION }}-
      - name: Импорт проекта
        run: ~/godot/godot --headless --path . --import
      # --slow 15: в конце части — 15 самых долгих тестов, кандидаты на ускорение прямо из лога CI (#1350)
      - name: Тесты
        run: ~/godot/godot --headless --path . -s tests/run.gd -- --shard ${{ matrix.part }}/3 --slow 15

  # Итог «Тесты» — зелёный, только когда зелёные все части. always(): иначе при упавшей части итог «skipped»,
  # а пропуск GitHub считает успехом. Без изменений кода части пропущены — итог тоже пропущен (зелёный).
  # Синтаксис скриптов тестера tools/qa/*.ps1 (#1350): в облачной сессии pwsh нет, ошибка всплывала только у тестера.
  # Парсер PowerShell 7 на ubuntu-раннере; кодировку (BOM для 5.1) проверяет test_qa_tools.
  ps1:
    name: Скрипты тестера
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Разбор .ps1
        shell: pwsh
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem tools/qa/*.ps1) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            foreach ($e in $errors) {
              Write-Output "::error file=tools/qa/$($f.Name),line=$($e.Extent.StartLineNumber)::$($e.Message)"
              $bad++
            }
            Write-Output "$($f.Name): ошибок $(@($errors).Count)"
          }
          if ($bad) { exit 1 }
      # Сводка ПРОВЕРИТЬ run-qa.ps1 (#1350): разбор отчётов и счёт тихих прогонов — на выдуманных папках
      - name: Проверка kadry.ps1
        shell: pwsh
        run: ./tools/qa/kadry.ps1 -SelfTest

  tests:
    name: Тесты
    needs: [changes, test-parts, ps1]
    if: always() && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Все части зелёные
        run: |
          echo "Части тестов: ${{ needs.test-parts.result }}, скрипты тестера: ${{ needs.ps1.result }}"
          test "${{ needs.test-parts.result }}" = "success"
          test "${{ needs.ps1.result }}" = "success"

  apk:
    name: Сборка APK
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Godot из кэша
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux
      - name: Скачать Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          curl -sSL -o g.zip "$GODOT_URL/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q g.zip && rm g.zip && mv Godot_v*_linux.x86_64 godot
      - name: Кэш импорта (.godot)
        uses: actions/cache@v4
        with:
          path: .godot
          key: godot-import-${{ env.GODOT_VERSION }}-${{ hashFiles('project.godot', '**/*.import', 'models/**', 'art/**/*.glb') }}
          restore-keys: godot-import-${{ env.GODOT_VERSION }}-
      - name: Шаблоны экспорта Android из кэша
        id: cache-tpl
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-templates-android-${{ env.GODOT_VERSION }}
      - name: Скачать шаблоны экспорта (только Android)
        if: steps.cache-tpl.outputs.cache-hit != 'true'
        run: |
          d=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$d"
          curl -sSL -o /tmp/t.tpz "$GODOT_URL/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -j -o /tmp/t.tpz 'templates/android_debug.apk' 'templates/android_release.apk' 'templates/version.txt' -d "$d"
          rm /tmp/t.tpz
          ls -la "$d"
      - name: Настройки редактора (SDK и Java)
        run: |
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "SDK: $sdk, Java: $JAVA_HOME"
          ls "$sdk/build-tools" | tail -3
          mkdir -p ~/.config/godot
          for v in 4 4.7; do
            cat > ~/.config/godot/editor_settings-$v.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$sdk"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
          done
          cat ~/.config/godot/editor_settings-4.7.tres
      - name: Номер версии
        run: |
          sed -i "s/^version\/code=.*/version\/code=${{ github.run_number }}/" export_presets.cfg
          echo "#${{ github.run_number }} ${GITHUB_SHA::7}" > version.txt   # версия на экран (Main.version_text)
      - name: Импорт проекта
        run: ~/godot/godot --headless --path . --import
      - name: Экспорт APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build
          # Два APK (#844): телефон — только arm64-v8a, эмулятор тестера (Pixel_8 на Windows) — только x86_64.
          # Раньше обе библиотеки шли в одном APK, и телефон тащил лишние ~27 МБ.
          ~/godot/godot --headless --path . --export-debug "Android" build/DeepDive.apk 2>&1 | tee build/export.log
          ~/godot/godot --headless --path . --export-debug "Android эмулятор" build/DeepDive-emulator.apk 2>&1 | tee -a build/export.log
          test -s build/DeepDive.apk && test -s build/DeepDive-emulator.apk
          ls -la build/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deepdive-apk
          path: |
            build/DeepDive.apk
            build/DeepDive-emulator.apk
            build/export.log
          if-no-files-found: warn

  # Релиз apk-latest — после зелёных «Тесты» и «APK», только на main (пуш или ручной запуск).
  # На PR и ветках не срабатывает: APK там остаётся артефактом «Сборка APK» (его берёт run-qa.ps1 -Pr).
  release:
    name: Выложить в релиз apk-latest
    needs: [tests, apk]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Скачать APK из джоба сборки
        uses: actions/download-artifact@v4
        with:
          name: deepdive-apk
          path: build
      - name: Выложить в релиз apk-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="APK из main, коммит ${GITHUB_SHA::7}: $(git log -1 --format=%s)"
          if gh release view apk-latest >/dev/null 2>&1; then
            gh release upload apk-latest build/DeepDive.apk build/DeepDive-emulator.apk --clobber
            gh release edit apk-latest --notes "$notes"
          else
            gh release create apk-latest build/DeepDive.apk build/DeepDive-emulator.apk --title "Свежий APK" --notes "$notes" --prerelease --target "$GITHUB_SHA"
          fi
