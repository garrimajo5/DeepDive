name: Godot
# Тесты (свой раннер tests/run.gd) и сборка APK. После слияния в main APK выкладывается в релиз apk-latest.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2
  GODOT_URL: https://github.com/godotengine/godot/releases/download/4.7.2-stable

concurrency:
  group: godot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Тесты
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Godot из кэша
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux
      - name: Скачать Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          curl -sSL -o g.zip "$GODOT_URL/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q g.zip && rm g.zip && mv Godot_v*_linux.x86_64 godot
      - name: Импорт проекта
        run: ~/godot/godot --headless --path . --import
      - name: Тесты
        run: ~/godot/godot --headless --path . -s tests/run.gd

  apk:
    name: Сборка APK
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Godot из кэша
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux
      - name: Скачать Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          curl -sSL -o g.zip "$GODOT_URL/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q g.zip && rm g.zip && mv Godot_v*_linux.x86_64 godot
      - name: Шаблоны экспорта Android из кэша
        id: cache-tpl
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-templates-android-${{ env.GODOT_VERSION }}
      - name: Скачать шаблоны экспорта (только Android)
        if: steps.cache-tpl.outputs.cache-hit != 'true'
        run: |
          d=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$d"
          curl -sSL -o /tmp/t.tpz "$GODOT_URL/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -j -o /tmp/t.tpz 'templates/android_debug.apk' 'templates/android_release.apk' 'templates/version.txt' -d "$d"
          rm /tmp/t.tpz
          ls -la "$d"
      - name: Настройки редактора (SDK и Java)
        run: |
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "SDK: $sdk, Java: $JAVA_HOME"
          ls "$sdk/build-tools" | tail -3
          mkdir -p ~/.config/godot
          for v in 4 4.7; do
            cat > ~/.config/godot/editor_settings-$v.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$sdk"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
          done
          cat ~/.config/godot/editor_settings-4.7.tres
      - name: Номер версии
        run: sed -i "s/^version\/code=.*/version\/code=${{ github.run_number }}/" export_presets.cfg
      - name: Импорт проекта
        run: ~/godot/godot --headless --path . --import
      - name: Экспорт APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build
          ~/godot/godot --headless --path . --export-debug "Android" build/DeepDive.apk 2>&1 | tee build/export.log
          test -s build/DeepDive.apk
          ls -la build/DeepDive.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deepdive-apk
          path: |
            build/DeepDive.apk
            build/export.log
          if-no-files-found: warn
      - name: Выложить в релиз apk-latest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="APK из main, коммит ${GITHUB_SHA::7}: $(git log -1 --format=%s)"
          if gh release view apk-latest >/dev/null 2>&1; then
            gh release upload apk-latest build/DeepDive.apk --clobber
            gh release edit apk-latest --notes "$notes"
          else
            gh release create apk-latest build/DeepDive.apk --title "Свежий APK" --notes "$notes" --prerelease --target "$GITHUB_SHA"
          fi
